<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do Olimpo ao Hades — zoom infinito</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #gl { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #speed { position: fixed; top: 50%; right: 18px; transform: translateY(-50%);
        font: 600 15px system-ui, sans-serif; color: #fff; background: #0008;
        backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 999px;
        opacity: 0; transition: opacity .3s; pointer-events: none; }
  #speed.show { opacity: 1; }
  #ui { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px; border-radius: 999px;
        background: #0008; backdrop-filter: blur(8px); transition: opacity .4s; }
  #ui button { font: 600 13px system-ui, sans-serif; color: #fffc; background: none;
        border: 0; padding: 7px 13px; border-radius: 999px; cursor: pointer; }
  #ui button[aria-pressed="true"] { background: #fff; color: #000; }
  #ui button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  body.idle #ui { opacity: 0; pointer-events: none; }
  @media (max-width: 560px) {
    #ui { gap: 2px; padding: 4px; width: max-content; max-width: calc(100vw - 16px);
          box-sizing: border-box; flex-wrap: wrap; justify-content: center; border-radius: 18px; }
    #ui button { font-size: 12px; padding: 6px 8px; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
        color: #fff8; font: 14px system-ui, sans-serif; pointer-events: none; }
  #loading.corner { inset: 12px 14px auto auto; display: block; font-size: 12px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">carregando…</div>
<div id="speed" aria-live="polite"></div>
<nav id="ui" aria-label="Efeitos">
  <button data-fx="0" aria-pressed="true">Original</button>
  <button data-fx="1">Cores</button>
  <button data-fx="2">Redemoinho</button>
  <button data-fx="3">Ácido</button>
  <button data-fx="4">Brilho</button>
  <button id="anim" aria-pressed="true" title="Liga/desliga os quadros animados (A)">Animação</button>
</nav>

<!--
  Cada quadro N+1 é o miolo de N reduzido a 50%; o miolo do último é o primeiro.
  Controles: roda do mouse / ↑ ↓ = velocidade · 1–5 = efeito · A = animação · F = tela cheia
  Os quadros listados em "animados" tocam como vídeo em loop; ?versao=estatica começa com a animação desligada.
  "feather" = largura do esfumado da borda (fração do quadro); cobre a faixa que a IA repintou na transição.
-->
<script id="zoom-config" type="application/json">
{ "speed": 0.12, "feather": 0.1,
  "animados": { "0": "animacao/q00.mp4", "7": "animacao/q07.mp4",
                "10": "animacao/q10.mp4", "11": "animacao/q11.mp4" },
  "imgarray": ["quadros/q00.jpg","quadros/q01.jpg","quadros/q02.jpg","quadros/q03.jpg",
               "quadros/q04.jpg","quadros/q05.jpg","quadros/q06.jpg","quadros/q07.jpg",
               "quadros/q08.jpg","quadros/q09.jpg","quadros/q10.jpg","quadros/q11.jpg"] }
</script>

<script>
const cfg = JSON.parse(document.getElementById('zoom-config').textContent);
const LAYERS = 4;
const N = cfg.imgarray.length, SIZE = 1024;   // nº de quadros e lado de referência (px)
const FADE_MS = 700;                            // esmaecimento do que chega depois do início
let frames = [], anims = {}, animOn = true, T = 0, speed = cfg.speed, fx = 0, last = 0, t0 = performance.now();

// 1) Composição do zoom num canvas 2D fora da tela
const comp = document.createElement('canvas');
const ctx = comp.getContext('2d');

// Máscara com as bordas esfumadas, para a costura com o quadro de fora sumir.
function featherMask(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in';
  const f = cfg.feather;
  const smooth = x => x * x * (3 - 2 * x);   // rampa em S: sem a "quina" de luz da rampa linear
  for (const [x1, y1] of [[w, 0], [0, h]]) {
    const grad = g.createLinearGradient(0, 0, x1, y1);
    for (let k = 0; k <= 8; k++) {
      const a = `rgba(0,0,0,${smooth(k / 8).toFixed(3)})`;
      grad.addColorStop(f * k / 8, a);
      grad.addColorStop(1 - f * k / 8, a);
    }
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);
  }
  return c;
}

// Cada quadro vira um canvas com a borda esfumada. Imagem: pronto uma vez.
// Vídeo: o canvas é redesenhado a cada frame (refresh), só quando está visível.
function feathered(src) {
  const isVideo = src instanceof HTMLVideoElement;
  const w = isVideo ? src.videoWidth : src.width, h = isVideo ? src.videoHeight : src.height;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d'), mask = featherMask(w, h);
  c.refresh = () => {
    g.globalCompositeOperation = 'copy'; g.drawImage(src, 0, 0, w, h);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(mask, 0, 0);
  };
  c.refresh();
  if (!isVideo) c.refresh = null;
  return c;
}

function compose() {
  const W = comp.width, H = comp.height, n = N;
  // A pintura inteira cabe na menor dimensão da tela (nada de cabeça cortada em tela larga);
  // o resto é preenchido pelos quadros de fora (b < 0), que já foram pintados em volta dela.
  const base = Math.min(W, H) / SIZE;
  const zoom = Math.pow(2, T % 1);                                    // 1× → 2×
  const aspect = Math.max(W, H) / Math.min(W, H);
  // quantos quadros de fora precisam para cobrir a tela inclusive com as bordas esfumadas
  const outer = Math.max(1, Math.ceil(Math.log2(aspect / (1 - 2 * cfg.feather))));
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const now = performance.now();
  // o que chega depois do início entra esmaecendo, em vez de saltar por cima da cena
  const alphaOf = c => c.bornAt ? Math.min(1, (now - c.bornAt) / FADE_MS) : 1;
  const draw = (img, b) => {
    const s = base * zoom / Math.pow(2, b) * (SIZE / img.width);
    const w = img.width * s, h = img.height * s;
    if (img.refresh) img.refresh();
    ctx.globalAlpha = alphaOf(img);
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    ctx.globalAlpha = 1;
  };
  for (let b = -outer; b < LAYERS; b++) {
    if (base * zoom / Math.pow(2, b) * SIZE < 2) break;
    const k = ((Math.floor(T) + b) % n + n) % n;
    const still = frames[k], clip = animOn ? anims[k] : null;
    // quadro que ainda não chegou: o de fora já tem uma versão menor dele no centro
    if (still && (!clip || alphaOf(clip) < 1)) draw(still, b);
    if (clip) draw(clip, b);
  }
}

// 2) Efeitos psicodélicos num shader WebGL por cima da composição
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl2') || glc.getContext('webgl');
const VS = `attribute vec2 p; varying vec2 uv;
  void main(){ uv = p*0.5+0.5; uv.y = 1.0-uv.y; gl_Position = vec4(p,0,1); }`;
const FS = `precision highp float;
  varying vec2 uv; uniform sampler2D tex; uniform float t; uniform int fx; uniform vec2 res;
  vec3 hue(vec3 c, float a){            // gira o matiz preservando o brilho
    const vec3 k = vec3(0.57735);
    float ca = cos(a);
    return c*ca + cross(k,c)*sin(a) + k*dot(k,c)*(1.0-ca);
  }
  vec2 swirl(vec2 u, float amt){         // torce a imagem em volta do centro
    vec2 d = (u-0.5)*vec2(res.x/res.y,1.0);
    float r = length(d);
    float a = amt*sin(t*0.4)*exp(-r*2.2) + amt*0.15*sin(r*14.0-t*1.5);
    float c = cos(a), s = sin(a);
    d = mat2(c,-s,s,c)*d;
    return d/vec2(res.x/res.y,1.0)+0.5;
  }
  void main(){
    vec2 u = uv;
    if (fx==2 || fx==3) u = swirl(u, fx==3 ? 2.2 : 1.4);
    if (fx==3) u += 0.004*vec2(sin(u.y*40.0+t*2.0), cos(u.x*40.0+t*1.7));
    vec3 c = texture2D(tex, u).rgb;
    if (fx==1) c = hue(c, t*0.6);
    if (fx==3) {
      c = hue(c, t*0.9 + length(u-0.5)*6.0);
      c = mix(c, c*c*2.2, 0.35);
    }
    if (fx==4) {                          // brilho: bloom barato + saturação pulsante
      vec3 b = vec3(0.0);
      for (int i=0;i<8;i++){ float a=float(i)*0.785; b += texture2D(tex, u+0.006*vec2(cos(a),sin(a))).rgb; }
      c = c + 0.35*max(b/8.0-0.55, 0.0)*2.5;
      float l = dot(c, vec3(0.299,0.587,0.114));
      c = mix(vec3(l), c, 1.25+0.2*sin(t*1.3));
      c = hue(c, 0.25*sin(t*0.5));
    }
    gl_FragColor = vec4(c,1.0);
  }`;
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc); gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);
gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
const U = { t: gl.getUniformLocation(prog, 't'), fx: gl.getUniformLocation(prog, 'fx'),
            res: gl.getUniformLocation(prog, 'res') };

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  glc.width = comp.width = Math.round(innerWidth * dpr);
  glc.height = comp.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, glc.width, glc.height);
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  T = (T + speed * dt + N) % N;
  compose();
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, comp);
  gl.uniform1f(U.t, (now - t0) / 1000);
  gl.uniform1i(U.fx, fx);
  gl.uniform2f(U.res, glc.width, glc.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

// 3) Controles
const buttons = [...document.querySelectorAll('#ui button[data-fx]')];
function setFx(n) {
  fx = n;
  buttons.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.fx === n)));
}
buttons.forEach(b => b.addEventListener('click', () => setFx(+b.dataset.fx)));
const animBtn = document.getElementById('anim');
function setAnim(on) {
  animOn = on;
  animBtn.setAttribute('aria-pressed', String(on));
  Object.values(anims).forEach(c => {
    if (on) { c.bornAt = performance.now(); c.video.play().catch(() => {}); } else c.video.pause();
  });
}
animBtn.addEventListener('click', () => setAnim(!animOn));
// Velocidade: mostra um indicador relativo à velocidade padrão (◀ = para trás).
const speedEl = document.getElementById('speed');
let speedHide;
function setSpeed(v) {
  speed = Math.max(-1, Math.min(1, v));
  const r = speed / cfg.speed;
  speedEl.textContent = Math.abs(r) < 0.05 ? '❚❚ parado' : `${r < 0 ? '◀' : '▶'} ${Math.abs(r).toFixed(1)}×`;
  speedEl.classList.add('show');
  clearTimeout(speedHide); speedHide = setTimeout(() => speedEl.classList.remove('show'), 900);
}
addEventListener('wheel', e => setSpeed(speed - e.deltaY * 0.0005), { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') setSpeed(speed + 0.03);
  if (e.key === 'ArrowDown') setSpeed(speed - 0.03);
  if (e.key >= '1' && e.key <= '5') setFx(+e.key - 1);
  if (e.key.toLowerCase() === 'a') setAnim(!animOn);
  if (e.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : glc.requestFullscreen();
});
// Barra de efeitos: aparece com o mouse (desktop) ou com um toque na tela (celular) e some sozinha.
let idle;
function showBar(ms) {
  document.body.classList.remove('idle');
  clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), ms);
}
function hideBar() { clearTimeout(idle); document.body.classList.add('idle'); }
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') showBar(2500); });
document.getElementById('ui').addEventListener('pointerdown', () => showBar(4000));
showBar(3000);

// Gestos na tela: toque = mostra/esconde a barra; arrastar para baixo acelera,
// para cima desacelera e, passando do zero, anda para trás.
const SWIPE = 0.0008;    // velocidade por pixel arrastado
let drag = null;
glc.addEventListener('pointerdown', e => {
  drag = { id: e.pointerId, y: e.clientY, y0: e.clientY, moved: false };
  glc.setPointerCapture(e.pointerId);
});
glc.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (Math.abs(e.clientY - drag.y0) > 10) drag.moved = true;
  if (drag.moved) setSpeed(speed + (e.clientY - drag.y) * SWIPE);
  drag.y = e.clientY;
});
glc.addEventListener('pointerup', e => {
  if (drag && !drag.moved && e.pointerType !== 'mouse') {
    document.body.classList.contains('idle') ? showBar(4000) : hideBar();
  }
  drag = null;
});
glc.addEventListener('pointercancel', () => { drag = null; });
addEventListener('resize', resize);

function loadOnce(src) {
  return new Promise((ok, fail) => {
    const fail_ = () => fail(new Error('Falhou: ' + src));
    if (src.includes('.mp4')) {
      const v = document.createElement('video');
      // iOS só toca sozinho com muted + playsinline como atributos
      v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
      Object.assign(v, { muted: true, loop: true, playsInline: true, preload: 'auto', src });
      v.addEventListener('loadeddata', () => v.play().then(() => ok(v), () => ok(v)), { once: true });
      v.onerror = fail_;
      return;
    }
    const im = new Image();
    im.onload = () => ok(im); im.onerror = fail_;
    im.src = src;
  });
}

// Rede de celular derruba uma requisição de vez em quando: tenta de novo antes de desistir.
async function load(src, tries = 4) {
  for (let i = 0; ; i++) {
    try { return await loadOnce(i ? `${src}?r=${i}` : src); }
    catch (err) {
      if (i + 1 >= tries) throw err;
      await new Promise(r => setTimeout(r, 800 * 2 ** i));
    }
  }
}

(async () => {
  resize();
  const loadingEl = document.getElementById('loading');
  // Ordem: o quadro inicial e os de fora (que preenchem as laterais) primeiro, depois o caminho do zoom.
  const order = [0, N - 1, N - 2, ...Array.from({ length: N - 3 }, (_, i) => i + 1)];
  let done = 0, started = false, failed = [];
  const start = () => {
    if (started) return;
    started = true;
    requestAnimationFrame(t => { last = t; frame(t); });
  };
  const progress = () => {
    loadingEl.textContent = `carregando… ${done}/${N}`;
    if (started) loadingEl.classList.add('corner');   // já rodando: o aviso vai para o canto
    if (done + failed.length === N) loadingEl.remove();
  };
  // Começa quando os 5 primeiros da fila resolveram (inicial, laterais e os 2 de dentro visíveis);
  // o resto entra esmaecendo conforme chega.
  const essentials = order.slice(0, 5), settled = new Set();
  // Até 3 downloads ao mesmo tempo, na ordem de prioridade.
  const queue = [...order];
  await Promise.all([0, 1, 2].map(async () => {
    while (queue.length) {
      const k = queue.shift();
      try {
        const c = feathered(await load(cfg.imgarray[k]));
        c.bornAt = started ? performance.now() : 0;
        frames[k] = c; done++;
      }
      catch (err) { failed.push(k); console.warn(err.message); }
      settled.add(k);
      if (frames[0] && essentials.every(e => settled.has(e))) start();
      progress();
    }
  }));
  if (!frames[0]) { loadingEl.textContent = 'Não carregou. Verifique a conexão e recarregue a página.'; return; }
  start();
  // Os clipes chegam por último, sem segurar o início; até lá aparece a pintura parada.
  for (const [i, src] of Object.entries(cfg.animados)) {
    load(src).then(v => {
      v.currentTime = 0;   // o clipe começa igual à pintura parada, então a troca não salta
      const c = feathered(v); c.video = v; c.bornAt = performance.now(); anims[i] = c;
      if (!animOn) v.pause();
    })
             .catch(err => console.warn(err.message));
  }
})();
if (new URLSearchParams(location.search).get('versao') === 'estatica') setAnim(false);
const fxParam = new URLSearchParams(location.search).get('fx');
if (fxParam) setFx(+fxParam);
</script>
</body>
</html>
